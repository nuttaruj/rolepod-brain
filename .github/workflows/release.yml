name: release

# Prebuilt binaries, so installing does not mean cloning a repository and
# owning a Rust toolchain. Every other memory tool in this space ships a
# package rather than a working tree; this is that.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true

# Read-only unless a job says otherwise. Only `publish` writes, and it neither
# fetches nor runs anything from outside this repository: every download and
# every pip install happens in a job whose token cannot touch the release. What
# those jobs made reaches `publish` as an artifact or through the cache, and
# every model file is checked against its recorded hash again on arrival.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every target carries the reranker now. Nothing links ONNX Runtime
          # at build time — `ort` runs in `load-dynamic` mode and opens a
          # library file at runtime — so the feature no longer depends on
          # whether a prebuilt runtime exists for the builder's toolchain. It
          # was that dependency, not the model or the code, that kept this off
          # Intel macOS and every Linux: the crate's own prebuilt wanted glibc
          # 2.38, while Microsoft's official ONNX Runtime needs only 2.27.
          #
          # Which runtime each platform receives is decided in the `runtime`
          # job below, not here.
          - target: aarch64-apple-darwin
            runner: macos-14
            test: true
            features: local-rerank
          # Cross-compiled from the arm64 runner rather than built on an Intel
          # one. GitHub is retiring the Intel macOS runners, and a release that
          # waits for the scarcest machine in the fleet is a release that does
          # not ship — the first attempt sat queued on it while every other
          # target had finished. Apple's toolchain targets both architectures
          # from either, so only the test step has to give way: a binary the
          # runner cannot execute cannot be tested on it.
          - target: x86_64-apple-darwin
            runner: macos-14
            test: false
            features: local-rerank
          # Built on the oldest runner we support rather than the newest, so
          # the glibc it links against is one an older distribution actually
          # has. A binary that only runs on the machine that built it is not a
          # release.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            test: true
            features: local-rerank
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            test: true
            features: local-rerank
          # The only Windows machine this project will ever touch, so the
          # suite runs here rather than being reasoned about. `msvc` and not
          # `gnu`: it is what a Windows user's toolchain already is, and the
          # ONNX Runtime Microsoft publishes is built against it.
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            test: true
            features: local-rerank
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        run: rustup target add ${{ matrix.target }}

      # The tests read the embedding model out of the checkout, and the
      # checkout does not carry it - 122 MB is past what a repository file may
      # be. Rebuilding it from upstream here is also what checks the claim in
      # PROVENANCE.md: the vendored weights are what quantize.py produces from
      # a pinned revision, and nothing but running it says so.
      - name: Cache the embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: assets/potion-multilingual-128M/model-int8.safetensors
          key: model-73908c3438cf03b6a01bcb9611d62b23d0726f08-v3
      - name: Cache the tokenizer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: assets/potion-multilingual-128M/tokenizer.json
          key: tokenizer-73908c3438cf03b6a01bcb9611d62b23d0726f08
      # One interpreter everywhere, so the pinned packages resolve to the same
      # wheels on every runner instead of whatever each image happens to ship.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # The recipe lives in the repository, shared with the CI lane: fetch the
      # pinned upstream revision, check it, quantise it, and hold the result to
      # PROVENANCE.md - which is also what checks a restored cache.
      - name: Build the embedding model
        shell: bash
        run: sh assets/potion-multilingual-128M/build.sh

      - name: Build
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      # The test seams (a release URL, a key, a forced hook fault) exist only
      # in debug builds. If one is in the release binary the build is wrong,
      # whatever the unit tests say.
      - name: No test seam in the binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          # Written to a file first, so a missing `strings` stops the step; the
          # control string proves the tool read the binary and printed
          # something. No pipe into `grep -q`: under the runner's pipefail the
          # writer's SIGPIPE would read as "not found".
          out="$RUNNER_TEMP/brain.strings"
          strings "target/${{ matrix.target }}/release/brain" > "$out"
          if ! grep -q ROLEPOD_BRAIN_NO_UPDATE "$out"; then
              echo "strings did not read the binary: control string not found" >&2
              exit 1
          fi
          if grep -E 'ROLEPOD_BRAIN_(UPDATE_|HOOK_FAULT)' "$out"; then
              echo "a debug-only seam is compiled into the release binary" >&2
              exit 1
          fi

      - name: Test
        # The same suite the repository runs. A binary nobody verified is
        # exactly the artifact this project argues against shipping — and the
        # one target that cannot run its own tests here is covered by the
        # identical source built and tested on the sibling architecture.
        if: matrix.test
        shell: bash
        run: |
          cargo test --release --locked --target ${{ matrix.target }} \
            ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      - name: Sign (macOS)
        if: runner.os == 'macOS'
        # Ad-hoc, which is all an unnotarized binary can have — but it must be
        # signed by something: copying an unsigned binary into place on macOS
        # produces a process the kernel kills on exec, with no output, which
        # looks exactly like a broken build.
        run: codesign -s - -f target/${{ matrix.target }}/release/brain

      - name: Package
        # `bash` explicitly: the Windows runner would otherwise use PowerShell,
        # where none of this is syntax.
        shell: bash
        run: |
          set -eu
          # Windows keeps the extension, because a downloaded file without one
          # is not something a Windows user can run.
          if [ "${{ runner.os }}" = "Windows" ]; then
              built="target/${{ matrix.target }}/release/brain.exe"
              name="brain-${{ matrix.target }}.exe"
          else
              built="target/${{ matrix.target }}/release/brain"
              name="brain-${{ matrix.target }}"
          fi
          mkdir -p dist
          cp "$built" "dist/$name"
          cd dist
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$name" > "$name.sha256"
          else
            sha256sum "$name" > "$name.sha256"
          fi
          cat "$name.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brain-${{ matrix.target }}
          path: dist/*

  # The reranker is 569 MB and nobody downloads it at install — only the first
  # search that actually asks for one does. It still has to be under this tag
  # when that happens, so it is built here, from the published float32 weights,
  # by the script in the repository. Its own job, because quantising means
  # installing packages from PyPI, and that does not happen where the token can
  # write. Cached because quantising 2.2 GB on every release is a waste of a
  # runner.
  reranker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Keyed on everything that decides the bytes: the upstream revision, the
      # script, and the packages it runs under. Change any one and the cache
      # misses rather than handing back a file built from something else.
      - name: Cache the reranker
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: assets/bge-reranker-v2-m3-int8/model.onnx
          key: reranker-bge-v2-m3-int8-c46cc14e4748b2332899dfe5e6dcd4750caf7cef-${{ hashFiles('assets/bge-reranker-v2-m3-int8/quantize.py', 'assets/bge-reranker-v2-m3-int8/requirements.txt') }}
      - name: Cache the reranker tokenizer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: assets/bge-reranker-v2-m3-int8/tokenizer.json
          key: reranker-tokenizer-bge-v2-m3-c46cc14e4748b2332899dfe5e6dcd4750caf7cef
      - name: Build the reranker
        shell: bash
        run: |
          set -eu
          R=assets/bge-reranker-v2-m3-int8
          # A revision, not `main`: a Hugging Face branch is mutable, and a
          # release built from it ships whatever was pushed there that day.
          UP=https://huggingface.co/EmbeddedLLM/bge-reranker-v2-m3-onnx-o3-cpu/resolve/c46cc14e4748b2332899dfe5e6dcd4750caf7cef
          # The same hashes are in PROVENANCE.md. Inputs are checked here,
          # before anything runs on them; what this job hands on is checked
          # against release.sha256 at the end.
          check() {
              got=$(sha256sum "$1" | cut -d' ' -f1)
              [ "$got" = "$2" ] || { echo "$1 is $got, PROVENANCE.md says $2" >&2; exit 1; }
          }
          [ -s "$R/tokenizer.json" ] || curl -fsSL -o "$R/tokenizer.json" "$UP/tokenizer.json"
          if [ ! -s "$R/model.onnx" ]; then
              # Both files keep their published names in a directory of their
              # own. The graph names its external data `model.onnx.data`
              # internally, so renaming the download breaks a reference that
              # is inside the file: "should be stored in model.onnx.data, but
              # it is not regular file".
              mkdir -p fp32
              curl -fsSL -o fp32/model.onnx "$UP/model.onnx"
              curl -fsSL -o fp32/model.onnx.data "$UP/model.onnx.data"
              check fp32/model.onnx 0308488c0748152186d6bfb3bfc9589175211cfbe45ffcec909dd4465848eeaa
              check fp32/model.onnx.data 84b66c787b9b98977a16d5c993a3959210a214c98fc3466da263c949c2068945
              python -m pip install --quiet --require-hashes --only-binary :all: -r "$R/requirements.txt"
              python "$R/quantize.py" fp32/model.onnx "$R/model.onnx"
              rm -rf fp32
          fi
          # Named apart from the embedding model's files: both are "a model
          # and its tokenizer", and one directory of release assets cannot
          # hold two files called tokenizer.json.
          mkdir -p dist
          cp "$R/model.onnx" dist/reranker-int8.onnx
          cp "$R/tokenizer.json" dist/reranker-tokenizer.json
          ls -l dist
      # ONNX Runtime, one per platform, taken from Microsoft's own releases
      # rather than linked into the binary.
      #
      # This table is the only place the per-platform version lives. It is not
      # one version because it cannot be: Microsoft stopped building for Intel
      # macOS after 1.23, and 1.23 is therefore the newest runtime that
      # platform can be given. Everywhere else gets 1.28, which is measurably
      # faster on this model - 1.161s against 1.575s for the same thirty pairs
      # - and the gap between 1.23 and 1.28 is adjacent swaps inside an
      # identical top ten, not a different answer.
      #
      # 1.22 is deliberately not here despite covering every platform at once:
      # it is 3.208s on the same batch, slower than the two above by more than
      # the coverage is worth.
      #
      # These are the official binaries, which need only glibc 2.27. The crate
      # `ort` publishes its own, and those are what wanted glibc 2.38 and what
      # never existed for Intel macOS at all.
      - name: Fetch ONNX Runtime
        run: |
          set -eu
          mkdir -p dist
          # PROVENANCE.md says these are copied unmodified. The hash each is
          # held to in release.sha256 is what makes that a checkable claim
          # rather than a promise: these are the libraries that were measured,
          # and a release asset that upstream replaced under the same name
          # would stop this job rather than ship. Windows ships a zip where the
          # others ship a tarball, which is the only reason the archive kind is
          # a parameter rather than assumed.
          SUMS=assets/bge-reranker-v2-m3-int8/release.sha256
          fetch() {
              target="$1"; pack="$2"; version="$3"; kind="$4"; inner="$5"
              want=$(awk -v f="onnxruntime-$target" '$2 == f { print $1 }' "$SUMS")
              url="https://github.com/microsoft/onnxruntime/releases/download"
              url="$url/v$version/onnxruntime-$pack-$version.$kind"
              echo "$target <- onnxruntime $version ($pack)"
              curl -fsSL -o "rt.$kind" "$url"
              case "$kind" in
                  tgz) tar xzf rt.tgz ;;
                  zip) unzip -q rt.zip ;;
              esac
              # Copied, not moved: the tarballs ship the real library beside
              # unversioned symlinks pointing at it, and a release asset that
              # is a dangling symlink is a zero-byte download.
              cp "onnxruntime-$pack-$version/lib/$inner" "dist/onnxruntime-$target"
              got=$(sha256sum "dist/onnxruntime-$target" | cut -d' ' -f1)
              if [ "$got" != "$want" ]; then
                  echo "onnxruntime $version for $target is not the one we measured" >&2
                  echo "  expected $want" >&2
                  echo "  got      $got" >&2
                  exit 1
              fi
              rm -rf "rt.$kind" "onnxruntime-$pack-$version"
          }
          fetch aarch64-apple-darwin      osx-arm64      1.28.0 tgz "libonnxruntime.1.28.0.dylib"
          fetch x86_64-apple-darwin       osx-x86_64     1.23.0 tgz "libonnxruntime.1.23.0.dylib"
          fetch x86_64-unknown-linux-gnu  linux-x64      1.28.0 tgz "libonnxruntime.so.1.28.0"
          fetch aarch64-unknown-linux-gnu linux-aarch64  1.28.0 tgz "libonnxruntime.so.1.28.0"
          fetch x86_64-pc-windows-msvc    win-x64        1.28.0 zip "onnxruntime.dll"
          ls -l dist

      - name: Check what leaves this job
        run: cd dist && sha256sum -c ../assets/bge-reranker-v2-m3-int8/release.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reranker
          path: dist/*
          # int8 weights and shared libraries barely compress; zipping 700 MB
          # is time for nothing.
          compression-level: 0

  # The only job that can see the signing key. It installs one distribution
  # package and runs one script from this repository: no pip, no cargo, no
  # downloaded script. It needs `build` for the binaries and nothing else, so
  # code from the reranker's PyPI install never shares a runner with the key.
  #
  # ubuntu-24.04 and not 22.04: `minisign` is in noble's universe (0.11-1) and
  # not in jammy at all. Universe is enabled on GitHub's image.
  #
  # Fails closed. A missing secret, a missing minisign.pub, or a signature that
  # does not verify against minisign.pub stops the workflow, and `publish`
  # needs this job, so nothing unsigned is ever released.
  sign:
    needs: build
    runs-on: ubuntu-24.04
    # The secret lives in this environment, which only a `v*` tag may deploy
    # to, so a branch or a pull request cannot read it even from this file.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Only the build artifacts, by name pattern; the reranker's is not fetched.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: brain-*
          path: artifacts

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign

      # The key goes to a 0600 file in the runner's temp dir and is removed by
      # the next step whatever happens here. Nothing prints it.
      - name: Sign and verify
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          KEY_FILE: ${{ runner.temp }}/minisign.key
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: sh .github/scripts/sign-release.sh artifacts signatures minisign.pub

      - name: Remove the key
        if: always()
        run: rm -f "${{ runner.temp }}/minisign.key"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signatures
          path: signatures/*.minisig
          if-no-files-found: error

  publish:
    needs: [build, reranker, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `gh` reads the token from the environment; nothing here pushes, so the
      # checkout has no reason to leave it in .git/config.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      # Every release carries the model: an installer fetching it for version
      # N must find it under version N's tag. The build jobs already produced
      # and checked it, so this is the same cache rather than a second recipe.
      - name: Cache the embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: assets/potion-multilingual-128M/model-int8.safetensors
          key: model-73908c3438cf03b6a01bcb9611d62b23d0726f08-v3
      - name: Cache the tokenizer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: assets/potion-multilingual-128M/tokenizer.json
          key: tokenizer-73908c3438cf03b6a01bcb9611d62b23d0726f08

      - name: Collect
        run: |
          set -eu
          mkdir -p dist
          # Each file from the job that made it, by name. Merging every
          # artifact into one folder would let any job - the reranker's, which
          # installs packages from PyPI - drop a file named like another job's
          # binary and have it shipped. The same goes for a whole artifact, so
          # the list below is the build matrix, and anything else stops here.
          for d in artifacts/*/; do
              a=$(basename "$d")
              case "$a" in
                  reranker|brain-aarch64-apple-darwin|brain-x86_64-apple-darwin|\
                  brain-x86_64-unknown-linux-gnu|brain-aarch64-unknown-linux-gnu|\
                  brain-x86_64-pc-windows-msvc)
                      # A signature belongs to the `sign` job alone. One
                      # arriving inside any other artifact is refused.
                      if ls "$d" | grep -q '\.minisig$'; then
                          echo "artifact $a carries a .minisig" >&2; exit 1
                      fi
                      [ "$a" = reranker ] || cp "$d$a"* dist/ ;;
                  signatures) ;;
                  *) echo "unexpected artifact $a - add it to the matrix and here" >&2; exit 1 ;;
              esac
          done
          # Exactly the five signatures, one per binary, and nothing else.
          for t in aarch64-apple-darwin x86_64-apple-darwin \
                   x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                   x86_64-pc-windows-msvc; do
              [ -s "artifacts/signatures/brain-$t.minisig" ] \
                  || { echo "no signature for $t" >&2; exit 1; }
              cp "artifacts/signatures/brain-$t.minisig" dist/
          done
          [ "$(ls artifacts/signatures | wc -l | tr -d ' ')" = 5 ] \
              || { echo "artifacts/signatures must hold exactly 5 files" >&2; exit 1; }
          ( cd artifacts/reranker && sha256sum -c ../../assets/bge-reranker-v2-m3-int8/release.sha256 )
          awk '{ print $2 }' assets/bge-reranker-v2-m3-int8/release.sha256 \
              | while read -r f; do cp "artifacts/reranker/$f" dist/; done
          # The embedding model arrives through the cache the build jobs
          # wrote, not an artifact, so it is held to PROVENANCE.md here too -
          # by the same script that built it, fetching nothing.
          MODEL=assets/potion-multilingual-128M
          sh "$MODEL/build.sh" --check
          cp "$MODEL/model-int8.safetensors" "$MODEL/tokenizer.json" dist/
          cd dist
          for f in model-int8.safetensors tokenizer.json reranker-int8.onnx \
                   reranker-tokenizer.json onnxruntime-*; do
              sha256sum "$f" > "$f.sha256"
          done
          # One file the installer can fetch to check any binary against,
          # rather than one request per platform.
          #
          # Normalised, because the tools do not agree on how to separate a
          # hash from a name. `sha256sum` on Git Bash writes `<hash> *<name>`
          # - its binary-mode marker - where every other runner here writes
          # two spaces, so adding a Windows target made this file internally
          # inconsistent and broke the installers reading it.
          cat ./*.sha256 | sed 's/ \*/  /' > SHA256SUMS
          rm -f ./*.sha256
          ls -l

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          gh release create "$TAG" --title "$TAG" --generate-notes || true

          # The reranker is 568MB, and uploads.github.com answers a large POST
          # with an occasional HTTP 404 *after* the bytes have landed. One
          # upload call for the whole directory turns that lost response into a
          # failed release. So: one file at a time, ask the release what it
          # actually holds before believing an error, and retry what is really
          # missing.
          landed() {
            gh release view "$TAG" --json assets \
              --jq '.assets[] | select(.state == "uploaded") | .name' \
              | grep -qx "$1"
          }

          for file in dist/*; do
            name=$(basename "$file")
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$file" --clobber; then
                break
              fi
              if landed "$name"; then
                echo "$name is on the release despite the error - keeping it"
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "could not upload $name after 3 attempts" >&2
                exit 1
              fi
              echo "retrying $name in 20s"
              sleep 20
            done
          done

          # Nothing above proves the set is complete, only that each upload
          # stopped erroring. Say so out loud.
          for file in dist/*; do
            name=$(basename "$file")
            landed "$name" || { echo "missing from release: $name" >&2; exit 1; }
          done
          echo "all $(ls dist | wc -l | tr -d ' ') assets are on $TAG"
