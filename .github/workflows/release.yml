name: release

# Prebuilt binaries, so installing does not mean cloning a repository and
# owning a Rust toolchain. Every other memory tool in this space ships a
# package rather than a working tree; this is that.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every target carries the reranker now. Nothing links ONNX Runtime
          # at build time — `ort` runs in `load-dynamic` mode and opens a
          # library file at runtime — so the feature no longer depends on
          # whether a prebuilt runtime exists for the builder's toolchain. It
          # was that dependency, not the model or the code, that kept this off
          # Intel macOS and every Linux: the crate's own prebuilt wanted glibc
          # 2.38, while Microsoft's official ONNX Runtime needs only 2.27.
          #
          # Which runtime each platform receives is decided in the `runtime`
          # job below, not here.
          - target: aarch64-apple-darwin
            runner: macos-14
            test: true
            features: local-rerank
          # Cross-compiled from the arm64 runner rather than built on an Intel
          # one. GitHub is retiring the Intel macOS runners, and a release that
          # waits for the scarcest machine in the fleet is a release that does
          # not ship — the first attempt sat queued on it while every other
          # target had finished. Apple's toolchain targets both architectures
          # from either, so only the test step has to give way: a binary the
          # runner cannot execute cannot be tested on it.
          - target: x86_64-apple-darwin
            runner: macos-14
            test: false
            features: local-rerank
          # Built on the oldest runner we support rather than the newest, so
          # the glibc it links against is one an older distribution actually
          # has. A binary that only runs on the machine that built it is not a
          # release.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            test: true
            features: local-rerank
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            test: true
            features: local-rerank
          # The only Windows machine this project will ever touch, so the
          # suite runs here rather than being reasoned about. `msvc` and not
          # `gnu`: it is what a Windows user's toolchain already is, and the
          # ONNX Runtime Microsoft publishes is built against it.
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            test: true
            features: local-rerank
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup target add ${{ matrix.target }}

      # The tests read the embedding model out of the checkout, and the
      # checkout does not carry it - 122 MB is past what a repository file may
      # be. Rebuilding it from upstream here is also what checks the claim in
      # PROVENANCE.md: the vendored weights are what quantize.py produces from
      # a pinned revision, and nothing but running it says so.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: assets/potion-multilingual-128M/model-int8.safetensors
          key: model-73908c3438cf03b6a01bcb9611d62b23d0726f08-v3
      - name: Cache the tokenizer
        uses: actions/cache@v4
        with:
          path: assets/potion-multilingual-128M/tokenizer.json
          key: tokenizer-73908c3438cf03b6a01bcb9611d62b23d0726f08
      - name: Build the embedding model
        shell: bash
        run: |
          set -eu
          MODEL=assets/potion-multilingual-128M
          UP=https://huggingface.co/minishlab/potion-multilingual-128M/resolve/73908c3438cf03b6a01bcb9611d62b23d0726f08
          [ -s "$MODEL/tokenizer.json" ] || curl -fsSL -o "$MODEL/tokenizer.json" "$UP/tokenizer.json"
          if [ ! -s "$MODEL/model-int8.safetensors" ]; then
              curl -fsSL -o upstream.safetensors "$UP/model.safetensors"
              python3 -m pip install --quiet --break-system-packages numpy safetensors \
                  || python3 -m pip install --quiet numpy safetensors
              python3 "$MODEL/quantize.py" upstream.safetensors "$MODEL/model-int8.safetensors"
              rm -f upstream.safetensors
          fi
          # Neither tool is on every runner: Git Bash on Windows ships
          # `sha256sum` and no `shasum`, and macOS ships the reverse.
          sha256() {
              if command -v sha256sum >/dev/null 2>&1; then
                  sha256sum "$1" | awk '{print $1}'
              else
                  shasum -a 256 "$1" | awk '{print $1}'
              fi
          }
          want=$(grep -A4 'vendored here' "$MODEL/PROVENANCE.md" | grep model-int8 | awk '{print $1}')
          got=$(sha256 "$MODEL/model-int8.safetensors")
          [ "$want" = "$got" ] || { echo "model checksum $got does not match PROVENANCE $want"; exit 1; }

      - name: Build
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      - name: Test
        # The same suite the repository runs. A binary nobody verified is
        # exactly the artifact this project argues against shipping — and the
        # one target that cannot run its own tests here is covered by the
        # identical source built and tested on the sibling architecture.
        if: matrix.test
        shell: bash
        run: |
          cargo test --release --locked --target ${{ matrix.target }} \
            ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      - name: Sign (macOS)
        if: runner.os == 'macOS'
        # Ad-hoc, which is all an unnotarized binary can have — but it must be
        # signed by something: copying an unsigned binary into place on macOS
        # produces a process the kernel kills on exec, with no output, which
        # looks exactly like a broken build.
        run: codesign -s - -f target/${{ matrix.target }}/release/brain

      - name: Package
        # `bash` explicitly: the Windows runner would otherwise use PowerShell,
        # where none of this is syntax.
        shell: bash
        run: |
          set -eu
          # Windows keeps the extension, because a downloaded file without one
          # is not something a Windows user can run.
          if [ "${{ runner.os }}" = "Windows" ]; then
              built="target/${{ matrix.target }}/release/brain.exe"
              name="brain-${{ matrix.target }}.exe"
          else
              built="target/${{ matrix.target }}/release/brain"
              name="brain-${{ matrix.target }}"
          fi
          mkdir -p dist
          cp "$built" "dist/$name"
          cd dist
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$name" > "$name.sha256"
          else
            sha256sum "$name" > "$name.sha256"
          fi
          cat "$name.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: brain-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Every release carries the model: an installer fetching it for version
      # N must find it under version N's tag. The build jobs already produced
      # and checked it, so this is the same cache rather than a second recipe.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: assets/potion-multilingual-128M/model-int8.safetensors
          key: model-73908c3438cf03b6a01bcb9611d62b23d0726f08-v3
      - name: Cache the tokenizer
        uses: actions/cache@v4
        with:
          path: assets/potion-multilingual-128M/tokenizer.json
          key: tokenizer-73908c3438cf03b6a01bcb9611d62b23d0726f08

      # The reranker is 569 MB and nobody downloads it at install — only the
      # first search that actually asks for one does. It still has to be under
      # this tag when that happens, so it is built here, from the published
      # float32 weights, by the script in the repository. Cached because
      # quantising 2.2 GB on every release is a waste of a runner.
      - name: Cache the reranker
        uses: actions/cache@v4
        with:
          path: assets/bge-reranker-v2-m3-int8/model.onnx
          key: reranker-bge-v2-m3-int8-v1
      - name: Cache the reranker tokenizer
        uses: actions/cache@v4
        with:
          path: assets/bge-reranker-v2-m3-int8/tokenizer.json
          key: reranker-tokenizer-bge-v2-m3-v1
      - name: Build the reranker
        shell: bash
        run: |
          set -eu
          R=assets/bge-reranker-v2-m3-int8
          UP=https://huggingface.co/EmbeddedLLM/bge-reranker-v2-m3-onnx-o3-cpu/resolve/main
          [ -s "$R/tokenizer.json" ] || curl -fsSL -o "$R/tokenizer.json" "$UP/tokenizer.json"
          if [ ! -s "$R/model.onnx" ]; then
              # Both files keep their published names in a directory of their
              # own. The graph names its external data `model.onnx.data`
              # internally, so renaming the download breaks a reference that
              # is inside the file: "should be stored in model.onnx.data, but
              # it is not regular file".
              mkdir -p fp32
              curl -fsSL -o fp32/model.onnx "$UP/model.onnx"
              curl -fsSL -o fp32/model.onnx.data "$UP/model.onnx.data"
              python3 -m pip install --quiet --break-system-packages onnx onnxruntime sympy \
                  || python3 -m pip install --quiet onnx onnxruntime sympy
              python3 "$R/quantize.py" fp32/model.onnx "$R/model.onnx"
              rm -rf fp32
          fi
          ls -l "$R"

      # ONNX Runtime, one per platform, taken from Microsoft's own releases
      # rather than linked into the binary.
      #
      # This table is the only place the per-platform version lives. It is not
      # one version because it cannot be: Microsoft stopped building for Intel
      # macOS after 1.23, and 1.23 is therefore the newest runtime that
      # platform can be given. Everywhere else gets 1.28, which is measurably
      # faster on this model - 1.161s against 1.575s for the same thirty pairs
      # - and the gap between 1.23 and 1.28 is adjacent swaps inside an
      # identical top ten, not a different answer.
      #
      # 1.22 is deliberately not here despite covering every platform at once:
      # it is 3.208s on the same batch, slower than the two above by more than
      # the coverage is worth. The measurements are in brief/11.
      #
      # These are the official binaries, which need only glibc 2.27. The crate
      # `ort` publishes its own, and those are what wanted glibc 2.38 and what
      # never existed for Intel macOS at all.
      - name: Fetch ONNX Runtime
        run: |
          set -eu
          mkdir -p runtimes
          # PROVENANCE.md says these are copied unmodified. The fifth column is
          # what makes that a checkable claim rather than a promise: these are
          # the libraries that were measured, and a release asset that upstream
          # replaced under the same name would stop this job rather than ship.
          # Windows ships a zip where the others ship a tarball, which is the
          # only reason the archive kind is a parameter rather than assumed.
          fetch() {
              target="$1"; pack="$2"; version="$3"; kind="$4"; inner="$5"; want="$6"
              url="https://github.com/microsoft/onnxruntime/releases/download"
              url="$url/v$version/onnxruntime-$pack-$version.$kind"
              echo "$target <- onnxruntime $version ($pack)"
              curl -fsSL -o "rt.$kind" "$url"
              case "$kind" in
                  tgz) tar xzf rt.tgz ;;
                  zip) unzip -q rt.zip ;;
              esac
              # Copied, not moved: the tarballs ship the real library beside
              # unversioned symlinks pointing at it, and a release asset that
              # is a dangling symlink is a zero-byte download.
              cp "onnxruntime-$pack-$version/lib/$inner" "runtimes/onnxruntime-$target"
              got=$(sha256sum "runtimes/onnxruntime-$target" | cut -d' ' -f1)
              if [ "$got" != "$want" ]; then
                  echo "onnxruntime $version for $target is not the one we measured" >&2
                  echo "  expected $want" >&2
                  echo "  got      $got" >&2
                  exit 1
              fi
              rm -rf "rt.$kind" "onnxruntime-$pack-$version"
          }
          fetch aarch64-apple-darwin      osx-arm64      1.28.0 tgz "libonnxruntime.1.28.0.dylib" \
              dc19bbcb2f5c9fb3c68b4f9248aa0a35065ff702c5dbeae75eac54a74da97b6d
          fetch x86_64-apple-darwin       osx-x86_64     1.23.0 tgz "libonnxruntime.1.23.0.dylib" \
              091d265e49da84ac8eafd6ff76b67688555192a272d784a252d550a858797d6f
          fetch x86_64-unknown-linux-gnu  linux-x64      1.28.0 tgz "libonnxruntime.so.1.28.0" \
              1461ef7cc3d9e49982591721683cc3e3a55580aeca9a5254e7aac47b75ee4bab
          fetch aarch64-unknown-linux-gnu linux-aarch64  1.28.0 tgz "libonnxruntime.so.1.28.0" \
              f1ec1a08eb99bd6e5401340f0a2b101381bf4694415480291dc13bcaa30f9ec7
          fetch x86_64-pc-windows-msvc    win-x64        1.28.0 zip "onnxruntime.dll" \
              18370c375f07357fa5874344a9d9ac17e6b6fe1eb18b1dd209d79483b4470257
          ls -l runtimes

      - name: Collect
        run: |
          set -eu
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cp runtimes/onnxruntime-* dist/
          cp assets/potion-multilingual-128M/model-int8.safetensors dist/
          cp assets/potion-multilingual-128M/tokenizer.json dist/
          # Named apart from the embedding model's files: both are "a model
          # and its tokenizer", and one directory of release assets cannot
          # hold two files called tokenizer.json.
          cp assets/bge-reranker-v2-m3-int8/model.onnx dist/reranker-int8.onnx
          cp assets/bge-reranker-v2-m3-int8/tokenizer.json dist/reranker-tokenizer.json
          cd dist
          for f in model-int8.safetensors tokenizer.json reranker-int8.onnx \
                   reranker-tokenizer.json onnxruntime-*; do
              sha256sum "$f" > "$f.sha256"
          done
          # One file the installer can fetch to check any binary against,
          # rather than one request per platform.
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          ls -l

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          gh release create "$TAG" --title "$TAG" --generate-notes || true

          # The reranker is 568MB, and uploads.github.com answers a large POST
          # with an occasional HTTP 404 *after* the bytes have landed. One
          # upload call for the whole directory turns that lost response into a
          # failed release. So: one file at a time, ask the release what it
          # actually holds before believing an error, and retry what is really
          # missing.
          landed() {
            gh release view "$TAG" --json assets \
              --jq '.assets[] | select(.state == "uploaded") | .name' \
              | grep -qx "$1"
          }

          for file in dist/*; do
            name=$(basename "$file")
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$file" --clobber; then
                break
              fi
              if landed "$name"; then
                echo "$name is on the release despite the error - keeping it"
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "could not upload $name after 3 attempts" >&2
                exit 1
              fi
              echo "retrying $name in 20s"
              sleep 20
            done
          done

          # Nothing above proves the set is complete, only that each upload
          # stopped erroring. Say so out loud.
          for file in dist/*; do
            name=$(basename "$file")
            landed "$name" || { echo "missing from release: $name" >&2; exit 1; }
          done
          echo "all $(ls dist | wc -l | tr -d ' ') assets are on $TAG"
