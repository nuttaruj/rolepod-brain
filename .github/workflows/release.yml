name: release

# Prebuilt binaries, so installing does not mean cloning a repository and
# owning a Rust toolchain. Every other memory tool in this space ships a
# package rather than a working tree; this is that.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            test: true
            # Local reranking needs `ort`, which publishes prebuilt
            # onnxruntime per target. Every target here has one except Intel
            # macOS, which is built by cross-compiling from this same runner —
            # so that binary goes without, and reranking there falls through to
            # the host CLI exactly as it does on any machine that has not
            # downloaded the weights.
            features: local-rerank
          # Cross-compiled from the arm64 runner rather than built on an Intel
          # one. GitHub is retiring the Intel macOS runners, and a release that
          # waits for the scarcest machine in the fleet is a release that does
          # not ship — the first attempt sat queued on it while every other
          # target had finished. Apple's toolchain targets both architectures
          # from either, so only the test step has to give way: a binary the
          # runner cannot execute cannot be tested on it.
          - target: x86_64-apple-darwin
            runner: macos-14
            test: false
            features: ""
          # Built on the oldest runner we support rather than the newest, so
          # the glibc it links against is one an older distribution actually
          # has. A binary that only runs on the machine that built it is not a
          # release.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            test: true
            # No local reranker on Linux, for the same reason this job runs on
            # the oldest supported runner in the first place. `ort` ships
            # prebuilt onnxruntime built against a newer toolchain than
            # 22.04 has: x86_64 wants glibc's `__isoc23_strtoll`, arm64 wants
            # libstdc++'s `__cxa_call_terminate`, and neither exists here.
            # Building on a newer runner would fix the link and break the
            # binary for every distribution older than that runner, which is
            # the trade this matrix was arranged to avoid. Reranking on Linux
            # goes through the host CLI until `ort` publishes a build that
            # links against something a 2022 distribution has.
            features: ""
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            test: true
            features: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup target add ${{ matrix.target }}

      # The tests read the embedding model out of the checkout, and the
      # checkout does not carry it - 122 MB is past what a repository file may
      # be. Rebuilding it from upstream here is also what checks the claim in
      # PROVENANCE.md: the vendored weights are what quantize.py produces from
      # a pinned revision, and nothing but running it says so.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: assets/potion-multilingual-128M/model-int8.safetensors
          key: model-73908c3438cf03b6a01bcb9611d62b23d0726f08-v3
      - name: Cache the tokenizer
        uses: actions/cache@v4
        with:
          path: assets/potion-multilingual-128M/tokenizer.json
          key: tokenizer-73908c3438cf03b6a01bcb9611d62b23d0726f08
      - name: Build the embedding model
        shell: bash
        run: |
          set -eu
          MODEL=assets/potion-multilingual-128M
          UP=https://huggingface.co/minishlab/potion-multilingual-128M/resolve/73908c3438cf03b6a01bcb9611d62b23d0726f08
          [ -s "$MODEL/tokenizer.json" ] || curl -fsSL -o "$MODEL/tokenizer.json" "$UP/tokenizer.json"
          if [ ! -s "$MODEL/model-int8.safetensors" ]; then
              curl -fsSL -o upstream.safetensors "$UP/model.safetensors"
              python3 -m pip install --quiet --break-system-packages numpy safetensors \
                  || python3 -m pip install --quiet numpy safetensors
              python3 "$MODEL/quantize.py" upstream.safetensors "$MODEL/model-int8.safetensors"
              rm -f upstream.safetensors
          fi
          want=$(grep -A4 'vendored here' "$MODEL/PROVENANCE.md" | grep model-int8 | awk '{print $1}')
          got=$(shasum -a 256 "$MODEL/model-int8.safetensors" | awk '{print $1}')
          [ "$want" = "$got" ] || { echo "model checksum $got does not match PROVENANCE $want"; exit 1; }

      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      - name: Test
        # The same suite the repository runs. A binary nobody verified is
        # exactly the artifact this project argues against shipping — and the
        # one target that cannot run its own tests here is covered by the
        # identical source built and tested on the sibling architecture.
        if: matrix.test
        run: |
          cargo test --release --locked --target ${{ matrix.target }} \
            ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      - name: Sign (macOS)
        if: runner.os == 'macOS'
        # Ad-hoc, which is all an unnotarized binary can have — but it must be
        # signed by something: copying an unsigned binary into place on macOS
        # produces a process the kernel kills on exec, with no output, which
        # looks exactly like a broken build.
        run: codesign -s - -f target/${{ matrix.target }}/release/brain

      - name: Package
        run: |
          set -eu
          name="brain-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/brain" "dist/$name"
          cd dist
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$name" > "$name.sha256"
          else
            sha256sum "$name" > "$name.sha256"
          fi
          cat "$name.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: brain-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Every release carries the model: an installer fetching it for version
      # N must find it under version N's tag. The build jobs already produced
      # and checked it, so this is the same cache rather than a second recipe.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: assets/potion-multilingual-128M/model-int8.safetensors
          key: model-73908c3438cf03b6a01bcb9611d62b23d0726f08-v3
      - name: Cache the tokenizer
        uses: actions/cache@v4
        with:
          path: assets/potion-multilingual-128M/tokenizer.json
          key: tokenizer-73908c3438cf03b6a01bcb9611d62b23d0726f08

      # The reranker is 569 MB and nobody downloads it at install — only the
      # first search that actually asks for one does. It still has to be under
      # this tag when that happens, so it is built here, from the published
      # float32 weights, by the script in the repository. Cached because
      # quantising 2.2 GB on every release is a waste of a runner.
      - name: Cache the reranker
        uses: actions/cache@v4
        with:
          path: assets/bge-reranker-v2-m3-int8/model.onnx
          key: reranker-bge-v2-m3-int8-v1
      - name: Cache the reranker tokenizer
        uses: actions/cache@v4
        with:
          path: assets/bge-reranker-v2-m3-int8/tokenizer.json
          key: reranker-tokenizer-bge-v2-m3-v1
      - name: Build the reranker
        shell: bash
        run: |
          set -eu
          R=assets/bge-reranker-v2-m3-int8
          UP=https://huggingface.co/EmbeddedLLM/bge-reranker-v2-m3-onnx-o3-cpu/resolve/main
          [ -s "$R/tokenizer.json" ] || curl -fsSL -o "$R/tokenizer.json" "$UP/tokenizer.json"
          if [ ! -s "$R/model.onnx" ]; then
              curl -fsSL -o fp32.onnx "$UP/model.onnx"
              curl -fsSL -o fp32.onnx.data "$UP/model.onnx.data"
              python3 -m pip install --quiet --break-system-packages onnx onnxruntime sympy \
                  || python3 -m pip install --quiet onnx onnxruntime sympy
              python3 "$R/quantize.py" fp32.onnx "$R/model.onnx"
              rm -f fp32.onnx fp32.onnx.data
          fi
          ls -l "$R"

      - name: Collect
        run: |
          set -eu
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cp assets/potion-multilingual-128M/model-int8.safetensors dist/
          cp assets/potion-multilingual-128M/tokenizer.json dist/
          # Named apart from the embedding model's files: both are "a model
          # and its tokenizer", and one directory of release assets cannot
          # hold two files called tokenizer.json.
          cp assets/bge-reranker-v2-m3-int8/model.onnx dist/reranker-int8.onnx
          cp assets/bge-reranker-v2-m3-int8/tokenizer.json dist/reranker-tokenizer.json
          cd dist
          for f in model-int8.safetensors tokenizer.json reranker-int8.onnx reranker-tokenizer.json; do
              sha256sum "$f" > "$f.sha256"
          done
          # One file the installer can fetch to check any binary against,
          # rather than one request per platform.
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          ls -l

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          gh release create "$TAG" --title "$TAG" --generate-notes || true
          gh release upload "$TAG" dist/* --clobber
