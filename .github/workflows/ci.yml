name: ci

# The fast lane, for every pull request and every push to main: lints, the
# locked test suite, a build on each operating system, and an advisory check
# of the dependency tree. What it leaves to the release workflow is the part
# that needs the reranker - downloading 600 MB and a runtime per platform is
# not a pull request's cost to pay - so everything here builds without the
# `local-rerank` feature and never reaches for the network in a test.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The same keys as the release workflow, so both share one cache per
      # branch; build.sh checks whatever comes back against PROVENANCE.md.
      - name: Cache the embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: assets/potion-multilingual-128M/model-int8.safetensors
          key: model-73908c3438cf03b6a01bcb9611d62b23d0726f08-v3
      - name: Cache the tokenizer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: assets/potion-multilingual-128M/tokenizer.json
          key: tokenizer-73908c3438cf03b6a01bcb9611d62b23d0726f08
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # A named toolchain, not the runner's: clippy runs with -D warnings, and
      # a lint new in the next Rust release should turn this red when someone
      # moves the pin, not on a morning when nothing changed.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.0"
          components: clippy
      # The tests read the embedding model out of the checkout, which does
      # not carry it.
      - name: Build the embedding model
        run: sh assets/potion-multilingual-128M/build.sh
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # With the feature, so a platform-specific cfg that no longer compiles
      # is found here rather than at release.
      - name: Build
        run: cargo build --locked --features local-rerank

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit
      # Fails on a vulnerability. An "unmaintained" notice is a warning here,
      # as in cargo-audit itself: the two current ones are a proc-macro and a
      # dev-only crate, neither of which ships in the binary.
      - name: Audit dependencies
        run: cargo audit
