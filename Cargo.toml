[package]
name = "rolepod-brain"
version = "0.32.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Install-and-forget memory for AI coding agents. No resident process."
repository = "https://github.com/nuttaruj/rolepod-brain"

[[bin]]
name = "brain"
path = "src/main.rs"

[features]
# The local reranker, off unless a build asks for it.
#
# Every target can carry it now. Nothing links ONNX Runtime at build time -
# the runtime arrives as a downloaded file next to the weights, the same way
# the weights themselves do - so the feature costs a build nothing but the
# code, and a machine without the download falls through to the host CLI
# exactly as it does before the model arrives.
default = []
local-rerank = ["dep:ort"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
jiff = "0.2"
# `load-dynamic` is the whole reason every platform can have this. The crate's
# own prebuilt onnxruntime is what demanded glibc 2.38 and what has no Intel
# macOS build at all; Microsoft's official binaries need glibc 2.27 and are
# published per platform. Loading one at runtime takes the choice of runtime
# out of the build and puts it next to the weights.
#
# `api-23` is a floor, not a pin: `ort` refuses a runtime OLDER than the API
# level it was built for and merely logs a note for a newer one. 23 is the
# last ONNX Runtime that Microsoft still built for Intel macOS, so this is the
# lowest floor any platform needs - every other platform loads 1.28 over it.
ort = { version = "2.0.0-rc.13", optional = true, default-features = false, features = ["std", "load-dynamic", "api-23"] }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
safetensors = "0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
toml = "0.9"
ulid = "1"
uuid = { version = "1", features = ["v5", "v4", "serde"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

[dev-dependencies]
model2vec-rs = { version = "0.2", default-features = false, features = ["local-only", "fancy-regex"] }
