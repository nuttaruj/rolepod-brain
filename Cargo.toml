[package]
name = "rolepod-brain"
version = "0.29.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Install-and-forget memory for AI coding agents. No resident process."
repository = "https://github.com/nuttaruj/rolepod-brain"

[[bin]]
name = "brain"
path = "src/main.rs"

[features]
# The local reranker, off unless a build asks for it.
#
# `ort` ships prebuilt onnxruntime per target and has none for
# x86_64-apple-darwin, which the release matrix cross-compiles on purpose
# (GitHub is retiring the Intel macOS fleet, and a release that waits for the
# scarcest machine does not ship). Rather than lose the target or the
# cross-compile, that build simply goes without: reranking there falls through
# to the host CLI, which is the same path every machine takes before the model
# is downloaded. The degradation already exists; this only widens who sees it.
default = []
local-rerank = ["dep:ort", "dep:ndarray"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
jiff = "0.2"
ndarray = { version = "0.16", optional = true }
ort = { version = "2.0.0-rc.13", optional = true }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
safetensors = "0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
toml = "0.9"
ulid = "1"
uuid = { version = "1", features = ["v5", "v4", "serde"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

[dev-dependencies]
model2vec-rs = { version = "0.2", default-features = false, features = ["local-only", "fancy-regex"] }
